services:
  mysql:
    image: mysql:8.0
    pull_policy: missing
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DATABASE_ROOT}
      - MYSQL_DATABASE=${PROJECT_NAME}
      - MYSQL_USER=${PROJECT_NAME}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - ${DATABASE_PORT}:3306
    volumes:
      - ${DATA_ROOT}/${PROJECT_NAME}/db:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_as_cs
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 2s
      retries: 20
      start_period: 30s
  redis:
    image: redis:7-alpine
    pull_policy: missing
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ${DATA_ROOT}/${PROJECT_NAME}/redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 5s
      timeout: 1s
      retries: 20
      start_period: 15s
  app:
    image: eclipse-temurin:17-jdk-jammy
    container_name: ${PROJECT_NAME}-app
    restart: unless-stopped
    ports:
      - ${APP_PORT}:8080
    # 挂载部署目录下的 JAR，容器内按 /app/${PROJECT_NAME}.jar 启动
    volumes:
      - ${DEPLOY_ROOT}/app/${PROJECT_NAME}.jar:/app/${PROJECT_NAME}.jar:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_DB=${PROJECT_NAME}
      - DATABASE_USERNAME=${PROJECT_NAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_ADDRESS=redis://redis:6379
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - exec java -Xms512m -Xmx2g -XX:MaxMetaspaceSize=512m -XX:CICompilerCount=2 -XX:TieredStopAtLevel=4 -Djava.security.egd=file:/dev/./urandom -jar /app/${PROJECT_NAME}.jar
      # 启动时间优化：
      #   -Djava.security.egd=file:/dev/./urandom：容器内 /dev/random 熵不足会导致 SecureRandom 阻塞数十秒
      #   -XX:CICompilerCount=2：减少 JIT 编译线程，避免容器 CPU 受限时 C2 编译拖慢启动
      #   -XX:TieredStopAtLevel=4：保留主要 C2 编译层，省掉 C2 高阶编译时间（峰值略降，启动明显加快）
  web:
    image: nginx:latest
    restart: unless-stopped
    ports:
      -  ${WEB_PORT}:80
    volumes:
      - ${DEPLOY_ROOT}/nginx/log:/var/log/nginx
      - ${DEPLOY_ROOT}/nginx/conf:/etc/nginx/conf.d
      - ${DEPLOY_ROOT}/nginx/www:/var/www/html
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
