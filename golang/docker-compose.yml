services:
  mysql:
    image: mysql:8.0
    pull_policy: missing
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DATABASE_ROOT}
      - MYSQL_DATABASE=${PROJECT_NAME}
      - MYSQL_USER=${PROJECT_NAME}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - ${DATABASE_PORT}:3306
    volumes:
      - ${DATA_ROOT}/${PROJECT_NAME}/db:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_as_cs
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 2s
      retries: 20
      start_period: 30s
  redis:
    image: redis:7-alpine
    pull_policy: missing
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ${DATA_ROOT}/${PROJECT_NAME}/redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 5s
      timeout: 1s
      retries: 20
      start_period: 15s
  app:
    image: gcr.io/distroless/static-debian12:nonroot
    container_name: ${PROJECT_NAME}-app
    restart: unless-stopped
    ports:
      - ${APP_PORT}:8080
    # 挂载部署目录下的 Go 静态二进制，distroless 镜像内直接执行
    volumes:
      - ${DEPLOY_ROOT}/app/${PROJECT_NAME}:/app/${PROJECT_NAME}:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_DB=${PROJECT_NAME}
      - DATABASE_USERNAME=${PROJECT_NAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_ADDRESS=redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - /app/${PROJECT_NAME}
  web:
    image: nginx:latest
    restart: unless-stopped
    ports:
      -  ${WEB_PORT}:80
    volumes:
      - ${DEPLOY_ROOT}/nginx/log:/var/log/nginx
      - ${DEPLOY_ROOT}/nginx/conf:/etc/nginx/conf.d
      - ${DEPLOY_ROOT}/nginx/www:/var/www/html
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
